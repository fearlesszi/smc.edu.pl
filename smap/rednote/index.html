<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>小红书全功能地图｜小红书功能版图</title>
<meta name="description" content="小红书全功能地图：以平面园区地图呈现身份基建、内容创作、流量增长、电商、数据、直播、AI与开放平台等功能。支持全屏浏览、缩放与拖动，快速了解小红书功能全貌。">
<meta name="keywords" content="小红书功能地图,小红书全功能,小红书功能大全,小红书运营工具,小红书创作者,小红书电商,小红书企业号">
<meta name="author" content="Sovereign Modern College">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://smc.edu.pl/smap/rednote">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="小红书全功能地图｜小红书功能版图">
<meta property="og:description" content="一张平面地图，快速看见小红书功能全貌。支持放大、缩小、拖动浏览。">
<meta property="og:url" content="https://smc.edu.pl/smap/rednote">
<meta property="og:site_name" content="Sovereign Modern College">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="小红书全功能地图">
<meta name="twitter:description" content="平面功能地图，浏览小红书功能全貌。">
<!-- 使用主站常见 favicon 入口；若主站 favicon 路径不同，可替换此处 href。 -->
<link rel="icon" href="https://smc.edu.pl/favicon.ico" sizes="any">
<link rel="icon" href="https://smc.edu.pl/assets-smc-crest-blue.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="https://smc.edu.pl/assets-smc-crest-blue.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" aria-label="小红书全功能地图">
  <div class="topbar">
    <button class="brand-copy" id="copyLink" aria-label="复制当前地图链接" title="点击复制地图链接">
      <img src="rednote.svg" alt="小红书" width="28" height="28">
    </button>
    <div class="map-name"><strong>小红书全功能地图</strong><span>REDNOTE FUNCTION MAP</span></div>
    <div class="top-tools">
      <label class="searchbox" aria-label="搜索地图功能">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
        <input id="search" type="search" placeholder="搜索功能" autocomplete="off">
        <button id="clearSearch" class="clear-search" aria-label="清除搜索" hidden>×</button>
      </label>
    </div>
  </div>
  <div class="map-status" id="mapStatus">16 个功能区域 · 265 项功能</div>
  <div id="viewport" class="viewport" aria-label="可缩放和拖动的地图画布">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="小红书功能园区平面地图" tabindex="0">
      <defs>
        <pattern id="groundGrid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#e9e7e3" stroke-width="1"/></pattern>
        <pattern id="parkDots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#d8e4d7"/></pattern>
      </defs>
      <g id="mapContent"></g>
    </svg>
  </div>
  <a class="smc-link" href="https://smc.edu.pl/" target="_blank" rel="noopener noreferrer" aria-label="Sovereign Modern College 网站" title="Sovereign Modern College">
    <img src="https://smc.edu.pl/assets-smc-crest-blue.svg" alt="SMC" width="24" height="24">
  </a>
  <div class="controls" aria-label="地图控制">
    <button id="zoomIn" title="放大" aria-label="放大地图"><span>＋</span></button>
    <output id="zoomValue" aria-live="polite">100%</output>
    <button id="zoomOut" title="缩小" aria-label="缩小地图"><span>−</span></button>
    <i></i>
    <button id="fitMap" title="显示全图" aria-label="显示全图"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"></path></svg></button>
  </div>
  <div class="hint">滚轮缩放 · 拖动浏览</div>
  <div id="toast" role="status" aria-live="polite"></div>
</main>
<script src="map-data.js"></script>
<script src="app.js"></script>
</body>
</html>
